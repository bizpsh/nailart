<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회사 소개 · 오시는 길 — 세무법인 올바른</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F8FAFC}
a{color:#2563EB}a:hover{color:#1D4ED8}
*{box-sizing:border-box}
a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0F172A; background: #F8FAFC; font-size: 16px; line-height: 1.6; font-variant-numeric: tabular-nums">
<dc-import name="Header" active="about" hint-size="100%,72px"></dc-import>

<section style="background: #0F172A; color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 64px; display: flex; flex-direction: column; gap: 14px">
<nav aria-label="현재 위치" style="font-size: 14px; color: #CBD5E1"><a href="Main.dc.html" style="color: #CBD5E1">홈</a> › 회사 소개</nav>
<h1 style="margin: 0; font-size: clamp(32px, 4vw, 48px); line-height: 1.25; letter-spacing: -0.03em">세금 앞에서도<br>올바른 길을 안내합니다</h1>
<p style="margin: 0; font-size: 18px; color: #CBD5E1; max-width: 640px">[회사 소개 한 문장 — 설립 배경이나 지향점]</p>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 0; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: -0.03em">우리가 지키는 세 가지</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{values}}" as="v" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border-radius: 20px; background: #FFFFFF; border: 1px solid #CBD5E1">
<span style="width: 52px; height: 52px; border-radius: 14px; background: #0F172A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icon}}"></path></svg>
</span>
<span style="font-size: 20px; font-weight: 700">{{v.title}}</span>
<span style="font-size: 15px; color: #475569">{{v.body}}</span>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; padding: 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #CBD5E1">
<span style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em">{{k.value}}</span>
<span style="font-size: 14px; color: #475569">{{k.label}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #475569">[기준일 YYYY.MM.DD · 산정 기준 표기]</p>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 96px 24px 0; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: -0.03em">걸어온 길</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #CBD5E1; overflow: hidden">
<sc-for list="{{history}}" as="h" hint-placeholder-count="4">
<li style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 20px 28px; border-bottom: 1px solid #E2E8F0">
<span style="font-size: 18px; font-weight: 700">{{h.y}}</span>
<span style="font-size: 16px; color: #334155">{{h.t}}</span>
</li>
</sc-for>
</ol>
</section>

<section id="location" style="max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-size: clamp(26px, 3vw, 34px); letter-spacing: -0.03em">오시는 길</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div role="img" aria-label="지도 영역 (지도 API 연동 예정)" style="flex: 999 1 520px; min-height: 380px; border-radius: 20px; background: #E2E8F0; border: 1px solid #CBD5E1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #334155">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
<span style="font-size: 16px; font-weight: 700">[지도 API 영역]</span>
</div>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{visit}}" as="v" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; padding: 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #CBD5E1">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F1F5F9; color: #0F172A; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 700; color: #475569">{{v.label}}</span>
<span style="font-size: 16px; font-weight: 600; white-space: pre-line">{{v.text}}</span>
</span>
</div>
</sc-for>
<a href="Contact.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #2563EB; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">방문 상담 예약하기</a>
</div>
</div>
</section>

<dc-import name="Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      values: [
        { title: '투명한 수임료', body: '업무 범위와 비용을 상담 단계에서 서면으로 안내합니다.', icon: 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6' },
        { title: '담당 세무사 전담', body: '상담한 세무사가 신고와 사후 관리까지 맡습니다.', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
        { title: '비밀 유지', body: '고객 정보와 상담 내용은 세무사법에 따라 보호합니다.', icon: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4' },
      ],
      kpis: [
        { value: '[00]년', label: '세무 업력' },
        { value: '[0,000]곳', label: '기장 거래처' },
        { value: '[00.0]%', label: '고객 만족도' },
        { value: '[00]명', label: '세무사 · 실무진' },
      ],
      history: [
        { y: '[YYYY]', t: '[세무법인 올바른 설립]' },
        { y: '[YYYY]', t: '[OO지점 개소 / 법인 전환]' },
        { y: '[YYYY]', t: '[주요 성과 · 수상 · 인증]' },
        { y: '[YYYY]', t: '[현재 — 주요 업무 확장]' },
      ],
      visit: [
        { label: '주소', text: '[서울특별시 OO구 OO로 00, 0층]', icon: 'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z' },
        { label: '대중교통', text: '[지하철 O호선 OO역 0번 출구 도보 0분]\n[버스 정류장 · 노선]', icon: 'M6 17h12M6 17V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12M6 17l-2 4M18 17l2 4M6 11h12' },
        { label: '주차', text: '[건물 주차 가능 여부 · 지원 시간]', icon: 'M5 3h14v18H5zM9 17V7h4a3 3 0 0 1 0 6H9' },
        { label: '운영 시간', text: '평일 09:00–18:00 · 점심 12:00–13:00\n[토·공휴일 운영 여부]', icon: 'M12 7v5l3 3M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' },
      ],
    };
  }
}
</script>
</body>
</html>
