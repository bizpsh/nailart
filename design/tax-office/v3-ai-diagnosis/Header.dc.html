<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 헤더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0F172A; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; min-height: 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F172A">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #0F172A; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 20V10M10 20V10M14 20V10M18 20V10M3 10l9-6 9 6"></path></svg>
</span>
<span style="font-weight: 700; font-size: 19px; letter-spacing: -0.03em">올바른 세무</span>
</a>
<nav aria-label="주요 메뉴" style="display: flex; gap: 4px; overflow-x: auto; max-width: 100%">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</nav>
<a href="Contact.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; background: #2563EB; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px; white-space: nowrap">상담 신청하기</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","services","experts","cases","about","contact"],"default":"home"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      { id: 'services', label: '서비스', href: 'Services.dc.html' },
      { id: 'experts', label: '세무사', href: 'Experts.dc.html' },
      { id: 'cases', label: '절세 사례', href: 'Cases.dc.html' },
      { id: 'about', label: '회사 소개', href: 'About.dc.html' },
    ];
    return {
      nav: items.map((n) => {
        const on = n.id === active;
        return {
          ...n,
          current: on ? 'page' : 'false',
          style: 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; text-decoration: none; font-size: 15px; white-space: nowrap; ' +
            (on ? 'background: #F1F5F9; color: #0F172A; font-weight: 700;' : 'color: #475569; font-weight: 600;'),
        };
      }),
    };
  }
}
</script>
</body>
</html>
