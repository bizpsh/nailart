<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세무사 소개 — 세무법인 올바른</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F8FAFC}
a{color:#2563EB}a:hover{color:#1D4ED8}
*{box-sizing:border-box}
button:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0F172A; background: #F8FAFC; font-size: 16px; line-height: 1.6">
<dc-import name="Header" active="experts" hint-size="100%,72px"></dc-import>

<section style="background: #0F172A; color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 64px; display: flex; flex-direction: column; gap: 14px">
<nav aria-label="현재 위치" style="font-size: 14px; color: #CBD5E1"><a href="Main.dc.html" style="color: #CBD5E1">홈</a> › 세무사</nav>
<h1 style="margin: 0; font-size: clamp(32px, 4vw, 48px); line-height: 1.25; letter-spacing: -0.03em">처음부터 끝까지,<br>같은 세무사가 맡습니다</h1>
<p style="margin: 0; font-size: 18px; color: #CBD5E1; max-width: 640px">자격·경력·이력을 그대로 공개합니다.</p>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-direction: column; gap: 24px">
<div role="tablist" aria-label="세무사 선택" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: {{t.bg}}">
<svg width="52" height="52" viewBox="44 50 80 80" aria-hidden="true"><path d="M18 200c4-46 30-68 66-68s62 22 66 68z" fill="{{t.suit}}"></path><circle cx="84" cy="88" r="30" fill="#F2C9A8"></circle><path d="{{t.hair}}" fill="#1F2430"></path></svg>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-start">
<span style="font-size: 14px; font-weight: 700; color: #475569">{{t.role}}</span>
<span style="font-size: 18px; font-weight: 700; color: #0F172A">{{t.name}}</span>
</span>
</button>
</sc-for>
</div>

<article role="tabpanel" style="display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #CBD5E1">
<div style="flex: 0 0 260px; height: 320px; border-radius: 20px; overflow: hidden; background: {{cur.bg}}">
<svg width="260" height="320" viewBox="0 0 168 200" preserveAspectRatio="xMidYMax meet" role="img" aria-label="세무사 일러스트 프로필 (실사진 교체 예정)">
<path d="M18 200c4-46 30-68 66-68s62 22 66 68z" fill="{{cur.suit}}"></path>
<path d="M72 134l12 30 12-30z" fill="#FFFFFF"></path>
<path d="M81 138h6l2 22-5 6-5-6z" fill="{{cur.tie}}"></path>
<rect x="76" y="110" width="16" height="22" rx="6" fill="#E8B996"></rect>
<circle cx="84" cy="88" r="30" fill="#F2C9A8"></circle>
<path d="{{cur.hair}}" fill="#1F2430"></path>
<circle cx="74" cy="92" r="2.6" fill="#1F2430"></circle>
<circle cx="94" cy="92" r="2.6" fill="#1F2430"></circle>
<path d="M77 104c4 3 10 3 14 0" fill="none" stroke="#A9705A" stroke-width="2.4" stroke-linecap="round"></path>
</svg>
</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700; color: #475569">{{cur.role}}</span>
<h2 style="margin: 0; font-size: 34px; letter-spacing: -0.03em">{{cur.name}}</h2>
<span style="font-size: 17px; color: #334155">{{cur.tagline}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cur.tags}}" as="g" hint-placeholder-count="3">
<span style="font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #F1F5F9; color: #0F172A">{{g}}</span>
</sc-for>
</div>
<blockquote style="margin: 0; padding: 20px 22px; border-radius: 16px; background: #F8FAFC; border: 1px solid #E2E8F0; font-size: 16px; color: #334155">{{cur.quote}}</blockquote>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">경력</span>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{cur.timeline}}" as="h" hint-placeholder-count="4">
<li style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid #E2E8F0; font-size: 15px">
<span style="font-weight: 700; color: #475569">{{h.y}}</span><span>{{h.t}}</span>
</li>
</sc-for>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">자격 · 활동</span>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{cur.creds}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F8FAFC; border: 1px solid #E2E8F0; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15l-4 6 1-5-4-3h5l2-5 2 5h5l-4 3 1 5z"></path></svg>{{r}}
</li>
</sc-for>
</ul>
</div>
</div>
<a href="Contact.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 14px; background: #2563EB; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">{{cur.ctaLabel}}</a>
</div>
</article>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 96px 24px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{promises}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #CBD5E1">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #F1F5F9; color: #0F172A; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
</span>
<span style="font-size: 18px; font-weight: 700">{{p.title}}</span>
<span style="font-size: 15px; color: #475569">{{p.body}}</span>
</div>
</sc-for>
</div>
</section>

<dc-import name="Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const E = [
      { role: '대표 세무사', name: '[세무사 이름]', tagline: '조사 대응·법인세 전문', tags: ['법인세', '세무조사', '법인 전환'], quote: '“[세무사 인사말 — 본인이 직접 작성한 2~3문장]”', timeline: [{ y: '[YYYY]', t: '[現 세무법인 올바른 대표 세무사]' }, { y: '[YYYY]', t: '[국세청 OO세무서 조사과]' }, { y: '[YYYY]', t: '[세무사 자격 취득]' }, { y: '[YYYY]', t: '[학력]' }], creds: ['세무사 ([제00회])', '[한국세무사회 회원]', '[저서 · 강의 · 기고]'], bg: '#DCE6FF', suit: '#1F2A44', tie: '#2563EB', hair: 'M54 86c0-20 13-32 30-32s30 12 30 32c-6-10-16-15-30-15s-24 5-30 15z' },
      { role: '파트너 세무사', name: '[세무사 이름]', tagline: '상속·증여 설계 전문', tags: ['상속·증여', '자산 설계', '신고 대리'], quote: '“[세무사 인사말 — 본인이 직접 작성한 2~3문장]”', timeline: [{ y: '[YYYY]', t: '[現 세무법인 올바른 파트너 세무사]' }, { y: '[YYYY]', t: '[OO회계법인]' }, { y: '[YYYY]', t: '[세무사 · 공인회계사 자격]' }, { y: '[YYYY]', t: '[학력]' }], creds: ['세무사 · [공인회계사]', '[한국세무사회 회원]', '[강의 · 세미나]'], bg: '#FFE9D6', suit: '#3A3F4B', tie: '#3A3F4B', hair: 'M52 96c-2-26 12-42 32-42s34 16 32 42c-2-14-6-22-12-26-6 6-14 9-24 9s-18-3-24-9c-2 8-4 16-4 26z' },
    ];
    const cur = E[this.state.sel];
    return {
      tabs: E.map((e, i) => {
        const on = this.state.sel === i;
        return { ...e, selected: on ? 'true' : 'false', pick: () => this.setState({ sel: i }),
          style: 'display: flex; align-items: center; gap: 14px; min-height: 80px; padding: 12px 16px; border-radius: 18px; cursor: pointer; text-align: left; font-family: inherit; background: #FFFFFF; border: 2px solid ' + (on ? '#0F172A' : '#CBD5E1') + ';' };
      }),
      cur: { ...cur, ctaLabel: cur.role + '에게 상담 신청' },
      promises: [
        { title: '담당자 고정', body: '상담한 세무사가 신고까지 직접 맡습니다.', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8' },
        { title: '응답 기준', body: '영업일 [24시간] 이내 회신을 원칙으로 합니다.', icon: 'M12 7v5l3 3M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' },
        { title: '비밀 유지', body: '세무사법상 비밀유지 의무를 지킵니다.', icon: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4' },
      ],
    };
  }
}
</script>
</body>
</html>
